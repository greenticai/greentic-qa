[workspace]
resolver = "2"
members = [
    "crates/qa-spec",
    "crates/component-qa",
    "crates/qa-lib",
    "crates/qa-cli",
]

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/greenticai/greentic-qa"
homepage = "https://github.com/greenticai/greentic-qa"
description = "Greentic QA tooling (component-qa, greentic-qa, qa-spec) for adaptive wizard flows."

[workspace.dependencies]
serde_json = "1"
serde_cbor = "0.11"
schemars = "1"
handlebars = "6"
thiserror = "2"
regex = "1"
globset = "0.4"
tempfile = "3"
assert_cmd = "2"
assert_fs = "1"
greentic-types = ">=1.2.0-0, <1.3.0-0"

[workspace.dependencies.qa-spec]
path = "crates/qa-spec"
version = ">=1.2.0-0, <1.3.0-0"

[workspace.dependencies.component-qa]
path = "crates/component-qa"
version = ">=1.2.0-0, <1.3.0-0"

[workspace.dependencies.greentic-qa-lib]
path = "crates/qa-lib"
version = ">=1.2.0-0, <1.3.0-0"

[workspace.dependencies.serde]
version = "1"
features = [
    "derive",
]

[workspace.dependencies.clap]
version = "4"
features = [
    "derive",
]

[workspace.dependencies.wit-bindgen]
version = "0.54"
default-features = false

[workspace.dependencies.greentic-interfaces-guest]
version = ">=1.2.0-0, <1.3.0-0"
default-features = false
